name: CI

on:
  push:
    branches: [main]
  # No branches filter here on purpose: this repo stacks PRs stage-by-stage
  # against each other's branches (see CLAUDE.md's "Stacked PRs across
  # stages"), not always against main, and a PR whose base isn't main still
  # needs CI run on it before it's driven to green. A `branches: [main]`
  # filter here would silently skip CI entirely for any PR targeting
  # another feature branch -- found empirically when PR #6/#7 (stacked on
  # #5) showed zero check runs despite real pushes.
  pull_request:

jobs:
  core:
    name: Core (pure Kotlin/JVM — build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Core tests
        run: ./gradlew :core:test --console=plain

  app:
    name: App (Android — lint + unit tests + assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # No separate Android SDK setup step: ubuntu-latest's GitHub-hosted
      # image ships a maintained Android SDK (ANDROID_HOME preconfigured,
      # licenses pre-accepted) including this project's compileSdk/
      # build-tools versions. android-actions/setup-android@v3 was tried
      # here first and failed — it unconditionally requests the legacy
      # 'tools' package, which Google removed from the SDK repository
      # years ago, so the action always fails on current SDK listings
      # regardless of this project. Confirmed via the actual CI run logs,
      # not assumed.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain
