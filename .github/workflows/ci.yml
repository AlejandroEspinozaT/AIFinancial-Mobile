name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    name: Core (pure Kotlin/JVM — build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Core tests
        run: ./gradlew :core:test --console=plain

  app:
    name: App (Android — lint + unit tests + assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # No separate Android SDK setup step: ubuntu-latest's GitHub-hosted
      # image ships a maintained Android SDK (ANDROID_HOME preconfigured,
      # licenses pre-accepted) including this project's compileSdk/
      # build-tools versions. android-actions/setup-android@v3 was tried
      # here first and failed — it unconditionally requests the legacy
      # 'tools' package, which Google removed from the SDK repository
      # years ago, so the action always fails on current SDK listings
      # regardless of this project. Confirmed via the actual CI run logs,
      # not assumed.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain
