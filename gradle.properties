org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Configures only the subprojects actually needed for the requested task(s)
# instead of the whole project graph eagerly. Without this, even a task
# scoped to :core alone would still configure :app (and therefore try to
# resolve the Android/Hilt Gradle plugins from Google's Maven) — see
# build.gradle.kts and CLAUDE.md.
org.gradle.configureondemand=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
